services:
  - type: web
    name: mld-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run db:deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
